<form class="w-full min-w-85 min-h-130 flex flex-col content-center align-center p-5 border-1 rounded bg-blue-50" [formGroup]="formContato" (ngSumit)="onSubmit(nomeContato.value, telefoneContato.value, emailContato.value, dataAniversario.value, tipoContato.value)">
    <h2 class="text-[26px] text-center mb-4">Cadastro de novo Contato</h2>
    
    <label for="nomeContato">Nome Contato<span class="text-red-600">*</span></label>
    <input type="text" name="nomeContato" id="nomeContato" placeholder="Nome e sobrenome" maxlength="100" required #nomeContato>

    <label for="telefoneContato">Número de Telefone<span class="text-red-600">*</span></label>
    <input type="tel" name="telefoneContato" id="telefoneContato" placeholder="Ex.: (84) 94002-8922" maxlength="20" required #telefoneContato>

    <label for="emailContato">Endereço de Email</label>
    <input type="email" name="emailContato" id="emailContato" placeholder="Ex.: exemplo@email.com" maxlength="100" #emailContato>

    <label for="dataAniversario">Data de Nascimento</label>
    <input type="date" name="dataAniversario" id="dataAniversario" #dataAniversario>

    <label for="tipoContato">Tipo de Contato</label>
    <select name="tipoContato" id="tipoContato" #tipoContato>
        <option value="" disabled>Tipo contato</option>
        <option value="Amigo">Amigo</option>
        <option value="Familia">Família</option>
        <option value="Trabalho">Trabalho</option>
    </select>

    <div class="content-center align-center text-center w-auto">
        <button type="submit" class="mt-3 bg-gray-300 w-30 p-2 rounded hover:bg-gray-500 hover:text-white">Cadastrar</button>
    </div>
</form>
