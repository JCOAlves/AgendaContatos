<main class="p-4 w-full max-w-250 mt-10 mb-10 ml-auto mr-auto bg-blue-200 rounded flex flex-col align-center">
  <h1 class="text-center mb-5">{{title()}}</h1>
  <div class="flex flex-col sm:flex-row gap-4 justify-between">
    <div class="p-3 border-1 rounded bg-blue-50 w-full min-h-130">
      <button class="mb-3 bg-gray-300 w-auto p-2 rounded hover:bg-gray-500 hover:text-white" (click)="exibirForm()">{{tituloBotao()}}</button>
      <div class="flex flex-col gap-3">
        @for(cont of listaContatos(); track cont){
          <p class="p-2 bg-green-200 gap-2 rounded">
            <span class="font-black">{{ cont.nome }}</span> <br>
            <span>{{cont.telefone}} - {{cont.email}}</span> <br>
            <span>Aniversario: {{cont.aniversario}} @if(cont.tipo){ - Tipo: {{cont.tipo}} }</span>
          </p>
        }
      </div>
    </div>
    <div class=""><!--Adicionar parametros de função-->
      @if(exibiForm()){
        <app-adiciona-contato (cadastraContato)="cadastrarContato($event)"/>
      }
    </div>
  </div>
</main>
<router-outlet />
