<main class="p-5 w-full max-w-250 mt-10 mb-10 ml-auto mr-auto bg-blue-200 rounded flex  flex-col align-center">
  <h1 class="text-center mb-5">{{title()}}</h1>
  <div class="flex flex-col sm:flex-row gap-4 justify-between">
    <div class="p-3 border-1 rounded bg-blue-50 w-full">
      @for(cont of listaContatos(); track cont){
        <p>{{ cont.nome }} - {{cont.telefone}}</p>
      }
      <button></button>
    </div>
    <div class=""><!--Adicionar parametros de função-->
      <app-adiciona-contato (cadastraContato)="cadastrarContato()"/>
    </div>
  </div>
</main>
<router-outlet />
